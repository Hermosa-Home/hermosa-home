<div id="login-screen" style="position:fixed;inset:0;background:var(--deep);z-index:9999;display:flex;align-items:center;justify-content:center;">

<script>
var HH_PWD = 'hermosa2026';
function checkLogin() {
  var pwd = document.getElementById('login-pwd');
  var err = document.getElementById('login-err');
  if (!pwd) return;
  if (pwd.value === HH_PWD) {
    document.getElementById('login-screen').style.display = 'none';
    sessionStorage.setItem('hh_auth', '1');
    initApp(); // Inizializza l'app dopo il login
  } else {
    err.style.display = 'block';
    pwd.value = '';
    pwd.focus();
    pwd.style.borderColor = '#E88';
    setTimeout(function(){ pwd.style.borderColor = 'rgba(196,149,106,.3)'; }, 1500);
  }
}
// Auto-login se già autenticato in questa sessione
if (sessionStorage.getItem('hh_auth') === '1') {
  document.addEventListener('DOMContentLoaded', function() {
    var ls = document.getElementById('login-screen');
    if (ls) ls.style.display = 'none';
    initApp();
  });
}
// Focus automatico
document.addEventListener('DOMContentLoaded', function() {
  var ls = document.getElementById('login-screen');
  if (ls && ls.style.display !== 'none') {
    var pwd = document.getElementById('login-pwd');
    if (pwd) setTimeout(function(){ pwd.focus(); }, 100);
  }
});
</script>

// Setup data corrente
function setupDate() {
  const n = new Date();
  const td = document.getElementById('topbar-date');
  if(td) td.textContent = n.toLocaleDateString('it-IT', {weekday:'long', day:'numeric', month:'long', year:'numeric'});
}

// Setup navigazione
function setupNav() {
  window.nav = function(id, el, title) {
    document.querySelectorAll('.panel').forEach(function(p) { p.classList.remove('active'); });
    document.querySelectorAll('.nav-item').forEach(function(n) { n.classList.remove('active'); });
    var panel = document.getElementById('panel-' + id);
    if(panel) panel.classList.add('active');
    var tt = document.getElementById('topbar-title');
    if(tt) tt.textContent = title || id;
    if(el) el.classList.add('active');
    else document.querySelectorAll('.nav-item').forEach(function(n) {
      var oc = n.getAttribute('onclick');
      if(oc && oc.indexOf("'" + id + "'") > -1) n.classList.add('active');
    });
    if(id === 'mappa' && !window.mapInitialized) initMap();
    if(window.innerWidth <= 820) closeSidebar();
  };
  
  window.toggleSidebar = function() {
    var sidebar = document.querySelector('.sidebar');
    var overlay = document.getElementById('sidebar-overlay');
    if(sidebar) sidebar.classList.toggle('open');
    if(overlay) overlay.classList.toggle('open');
  };
  
  window.closeSidebar = function() {
    var sidebar = document.querySelector('.sidebar');
    var overlay = document.getElementById('sidebar-overlay');
    if(sidebar) sidebar.classList.remove('open');
    if(overlay) overlay.classList.remove('open');
  };
}

// Setup modali
function setupModals() {
  window.openModal = function(id) {
    var el = document.getElementById(id);
    if(!el) { console.warn('Modal non trovato:', id); return; }
    el.classList.add('open');
    if(id === 'modal-contratto' || id === 'modal-notifica' || id === 'modal-pagamento') {
      setTimeout(popolaSelectOspiti, 100);
    }
  };
  
  window.closeModal = function(id) {
    var el = document.getElementById(id);
    if(el) el.classList.remove('open');
  };
  
  window.notify = function(msg) {
    var e = document.getElementById('notify-toast');
    if(!e) return;
    var et = document.getElementById('notify-text');
    if(et) et.textContent = msg;
    e.classList.add('show');
    clearTimeout(window.notifyTimeout);
    window.notifyTimeout = setTimeout(function() { e.classList.remove('show'); }, 2800);
  };
  
  // Chiudi modal cliccando fuori
  document.addEventListener('click', function(e) {
    if(e.target && e.target.classList && e.target.classList.contains('modal-backdrop') && e.target.classList.contains('open')) {
      e.target.classList.remove('open');
    }
  });
}

// Setup mappa
window.mapInitialized = false;
function initMap() {
  if(window.mapInitialized) return;
  window.mapInitialized = true;
  
  const lat = 38.12340, lng = 13.35912;
  const mapDiv = document.getElementById('map');
  if(!mapDiv) return;
  
  const map = L.map('map', { scrollWheelZoom: false }).setView([lat, lng], 15);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OpenStreetMap contributors', maxZoom: 19
  }).addTo(map);
  
  // Main marker
  const hhIcon = L.divIcon({
    html: `<div style="background:#C4956A;color:white;border-radius:50% 50% 50% 0;transform:rotate(-45deg);width:34px;height:34px;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 10px rgba(0,0,0,.3);border:2px solid white;">
      <span style="transform:rotate(45deg);font-size:16px;">🏠</span></div>`,
    className: '', iconSize: [34,34], iconAnchor: [17,34]
  });
  
  L.marker([lat, lng], { icon: hhIcon }).addTo(map)
    .bindPopup(`<div style="font-family:'DM Sans',sans-serif;min-width:200px;">
      <div style="font-weight:700;font-size:14px;color:#2C2416;margin-bottom:4px;">🌹 Hermosa Home di Alessandra Trapani</div>
      <div style="font-size:12px;color:#6B5C48;">Via Mariano Stabile 124<br>Piano Terzo · 90139 Palermo</div>
    </div>`, { maxWidth: 250 });
}

function setupMap() {
  // Fallback per quando la mappa viene caricata dopo
  if(document.getElementById('map')) {

  }
}

window.saveBooking = function() {
  var guestName = document.querySelector('#modal-booking input[type="text"]')?.value.trim() || 'Ospite Demo';
  var suiteEl = document.querySelector('#modal-booking select');
  var suite = suiteEl ? suiteEl.value : 'Tomasi di Lampedusa';
  var checkin = document.querySelectorAll('#modal-booking input[type="date"]')[0]?.value || new Date().toISOString().split('T')[0];
  var checkout = document.querySelectorAll('#modal-booking input[type="date"]')[1]?.value || new Date(Date.now() + 86400000 * 3).toISOString().split('T')[0];
  
  var fmt = function(d) { return d ? new Date(d).toLocaleDateString('it-IT', {day:'2-digit', month:'2-digit'}) : '—'; };
  
  // Aggiungi alla tabella prenotazioni
  var tbody = document.querySelector('#panel-prenotazioni table tbody');
  if(tbody) {
    var tr = document.createElement('tr');
    tr.innerHTML = `
      <td><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--terra);margin-right:5px;"></span>${suite}</td>
      <td><strong>${guestName}</strong></td>
      <td>${fmt(checkin)} 14:00</td>
      <td>${fmt(checkout)} 10:00</td>
      <td><span class="badge bo">⏳ Da inviare</span></td>
      <td><span class="badge br">⚠️</span></td>
      <td><span class="badge br">€ — ✗</span></td>
      <td><button class="btn btn-ghost btn-sm" onclick="openModal('modal-dettaglio')">👁</button></td>
    `;
    tbody.appendChild(tr);
  }
  
  closeModal('modal-booking');
  notify('✅ Prenotazione salvata con successo!');
};

// Gestione notifiche push
window.attivaNotifichePush = function() {
  if(!('Notification' in window)) {
    notify('⚠️ Il tuo browser non supporta le notifiche');
    return;
  }
  if(Notification.permission === 'granted') {
    notify('✅ Notifiche già attive');
    new Notification('Hermosa Home', { body: 'Notifiche attive!' });
    return;
  }
  Notification.requestPermission().then(function(perm) {
    if(perm === 'granted') notify('✅ Notifiche attivate!');
    else notify('⚠️ Permesso negato');
  });
};

// Gestione QR
window.stampaQROspite = function() {
  var linkEl = document.getElementById('invia-link');
  if(!linkEl) { notify('⚠️ Nessun link'); return; }
  var html = '<!DOCTYPE html><html><head><meta charset="UTF-8"><title>QR Code</title></head><body style="text-align:center;padding:40px;"><h2>Hermosa Home</h2><p>Scansiona con la fotocamera del telefono</p><div style="margin:20px;">🔗 ' + linkEl.value + '</div></body></html>';
  var blob = new Blob([html], {type: 'text/html'});
  var blobUrl = URL.createObjectURL(blob);
  var win = window.open(blobUrl, '_blank');
  setTimeout(function() { if(win) win.print(); setTimeout(function(){ URL.revokeObjectURL(blobUrl); }, 5000); }, 1000);
};
